<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mur</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../src/tokens.css">
  <script type="module" src="../src/mur.js"></script>
  <style>
    body {
      margin: 0;
      background: var(--mur-color-bg);
    }

    /* Avoid a flash of unstyled content while the module loads. */
    mur-app:not(:defined) {
      visibility: hidden;
    }

    .brand {
      font-size: var(--mur-font-size-m);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-inline-end: var(--mur-space-m);
    }

    button,
    input {
      font: inherit;
      color: inherit;
      border-radius: var(--mur-radius);
      min-height: 2rem;
      box-sizing: border-box;
    }

    button {
      padding-inline: var(--mur-space-m);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
    }

    button:hover:not(:disabled, [aria-pressed='true']) {
      background: var(--mur-color-hover);
    }

    button:disabled {
      color: var(--mur-color-text-muted);
      cursor: default;
      opacity: 0.6;
    }

    button[aria-pressed='true'] {
      background: var(--mur-color-accent);
      color: var(--mur-color-on-accent);
    }

    input {
      padding-inline: var(--mur-space-m);
      background: var(--mur-color-bg);
      border: 1px solid var(--mur-color-border-strong);
    }

    input::placeholder {
      color: var(--mur-color-text-muted);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--mur-color-focus);
      outline-offset: 2px;
    }

    .theme {
      display: flex;
      gap: var(--mur-space-xs);
    }

    .content {
      padding: var(--mur-space-l);
    }

    .sidebar {
      min-height: 100%;
      box-sizing: border-box;
      background: var(--mur-color-surface);
    }

    h1,
    h2 {
      margin: 0 0 var(--mur-space-s);
      font-size: var(--mur-font-size-m);
      font-weight: 600;
    }

    p {
      margin: 0 0 var(--mur-space-m);
      color: var(--mur-color-text-muted);
    }

    /* A plain list, only to show the store working. Real views come in step 4. */
    .rows {
      margin: 0;
      padding: 0;
      list-style: none;
      font-variant-numeric: tabular-nums;
    }

    .rows li {
      display: flex;
      justify-content: space-between;
      gap: var(--mur-space-l);
      padding-block: var(--mur-space-s);
      border-block-end: 1px solid var(--mur-color-border);
    }

    .rows .muted {
      color: var(--mur-color-text-muted);
    }
  </style>
</head>
<body>
  <mur-app>
    <mur-toolbar slot="toolbar" aria-label="Main">
      <span slot="start" class="brand">Mur</span>

      <button id="pause" aria-pressed="false">Pause</button>
      <button id="open-only" aria-pressed="false">Open only</button>
      <button id="by-total" aria-pressed="false">Highest total</button>
      <button disabled>Export</button>
      <input id="search" type="search" placeholder="Search customer" aria-label="Search customer">

      <div slot="end" class="theme" role="group" aria-label="Theme">
        <button data-theme-choice="" aria-pressed="true">Auto</button>
        <button data-theme-choice="light" aria-pressed="false">Light</button>
        <button data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </mur-toolbar>

    <mur-splitter position="26" min-start="160" min-end="200" persist="demo-sidebar" label="Resize sidebar">
      <div slot="start" class="content sidebar">
        <h1>Sidebar</h1>
        <p>Drag the divider, or focus it and use the arrow keys, Home and End. The position survives a reload.</p>
      </div>

      <mur-splitter slot="end" orientation="vertical" position="70" min-start="120" min-end="80"
        persist="demo-details" label="Resize details">
        <mur-tabs slot="start" label="Demo views">
          <mur-tab-panel label="Orders">
            <div class="content">
              <h2>Fake orders</h2>
              <p id="orders-count"></p>
              <ul class="rows" id="orders"></ul>
            </div>
          </mur-tab-panel>
          <mur-tab-panel label="Server metrics">
            <div class="content">
              <h2>Fake metrics</h2>
              <p>This panel keeps updating while hidden.</p>
              <ul class="rows" id="metrics"></ul>
            </div>
          </mur-tab-panel>
        </mur-tabs>

        <div slot="end" class="content">
          <h2>Details</h2>
          <p>A vertical splitter, nested inside the horizontal one.</p>
        </div>
      </mur-splitter>
    </mur-splitter>

    <mur-statusbar slot="statusbar">
      <span slot="start" id="last-event">No events yet</span>
    </mur-statusbar>
  </mur-app>

  <script type="module">
    import { Store } from '../src/data/store.js';
    import { MockSource } from '../src/data/sources/mock.js';

    const orders = new Store();
    const metrics = new Store();
    const ordersSource = new MockSource({ type: 'orders' });
    const metricsSource = new MockSource({ type: 'metrics' });

    const money = new Intl.NumberFormat('en', { style: 'currency', currency: 'EUR' });

    /** Replaces a list's rows; each row is [main text, muted text]. */
    function renderRows(list, rows) {
      list.replaceChildren(...rows.map(([main, muted]) => {
        const row = document.createElement('li');
        const mutedText = document.createElement('span');
        mutedText.className = 'muted';
        mutedText.textContent = muted;
        const mainText = document.createElement('span');
        mainText.textContent = main;
        row.append(mainText, mutedText);
        return row;
      }));
    }

    orders.addEventListener('change', () => {
      document.querySelector('#orders-count').textContent = `${orders.items.length} shown`;
      renderRows(document.querySelector('#orders'), orders.items.map((order) => [
        `${order.number} ${order.customer}`,
        `${money.format(order.total)} · ${order.state}`,
      ]));
    });

    metrics.addEventListener('change', () => {
      renderRows(document.querySelector('#metrics'), metrics.items.map((metric) => [
        metric.label,
        `${metric.value}${metric.unit}`,
      ]));
    });

    // Newest first, until "Highest total" is pressed.
    const newestFirst = (a, b) => b.id - a.id;
    const highestTotal = (a, b) => b.total - a.total;
    orders.sorter = newestFirst;

    // Toolbar buttons and search drive the store's filter and sorter.
    const search = document.querySelector('#search');
    const openOnly = document.querySelector('#open-only');

    function updateFilter() {
      const text = search.value.trim().toLowerCase();
      const onlyOpen = openOnly.getAttribute('aria-pressed') === 'true';
      orders.filter = (order) => order.customer.toLowerCase().includes(text)
        && (!onlyOpen || order.state !== 'completed');
    }

    /** Flips a toggle button, and returns its new state. */
    function toggle(button) {
      const pressed = button.getAttribute('aria-pressed') !== 'true';
      button.setAttribute('aria-pressed', String(pressed));
      return pressed;
    }

    search.addEventListener('input', updateFilter);
    openOnly.addEventListener('click', () => {
      toggle(openOnly);
      updateFilter();
    });
    document.querySelector('#by-total').addEventListener('click', (event) => {
      orders.sorter = toggle(event.currentTarget) ? highestTotal : newestFirst;
    });
    document.querySelector('#pause').addEventListener('click', (event) => {
      if (toggle(event.currentTarget)) {
        ordersSource.stop();
        metricsSource.stop();
      } else {
        ordersSource.start(orders);
        metricsSource.start(metrics);
      }
    });

    document.querySelector('mur-statusbar').source = ordersSource;
    ordersSource.start(orders);
    metricsSource.start(metrics);

    // Show the components' events in the status bar.
    const lastEvent = document.querySelector('#last-event');
    document.addEventListener('mur-resize', (event) => {
      lastEvent.textContent = `mur-resize: ${event.detail.position}%`;
    });
    document.addEventListener('mur-tab-change', (event) => {
      lastEvent.textContent = `mur-tab-change: tab ${event.detail.index}`;
    });

    // Theme switcher.
    const themeButtons = document.querySelectorAll('[data-theme-choice]');
    for (const button of themeButtons) {
      button.addEventListener('click', () => {
        const theme = button.dataset.themeChoice;
        if (theme) {
          document.documentElement.dataset.theme = theme;
        } else {
          delete document.documentElement.dataset.theme;
        }
        for (const other of themeButtons) {
          other.setAttribute('aria-pressed', String(other === button));
        }
      });
    }
  </script>
</body>
</html>
